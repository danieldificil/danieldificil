<svg xmlns="http://www.w3.org/2000/svg" width="124" height="44" viewBox="0 0 124 44" role="img" aria-label="LinkedIn">
<title>LinkedIn</title>
<style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace}.shine{animation:b 4s ease-in-out infinite}@keyframes b{0%,55%{transform:translateX(-80px)}100%{transform:translateX(204px)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<defs>
<linearGradient id="light" x1="0" x2="1"><stop offset="0" stop-color="#a77bff" stop-opacity="0"/><stop offset=".5" stop-color="#a77bff" stop-opacity=".35"/><stop offset="1" stop-color="#a77bff" stop-opacity="0"/></linearGradient>
