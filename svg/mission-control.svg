<svg xmlns="http://www.w3.org/2000/svg" width="840" height="306" viewBox="0 0 840 306" role="img" aria-label="Mission Control: telemetry from the AI agent crew">
<title>Mission Control: telemetry from the AI agent crew</title>
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace}
.t{fill:#c9b8ff}.uv{fill:#a77bff}.ok{fill:#3ef0a0}.dim{fill:#6b5a99}.w{fill:#fff}
.hd{font-size:13px;font-weight:700;letter-spacing:2.5px}.hdr{font-size:11px;font-weight:700;letter-spacing:2px}
.pulse{animation:p 2s ease-in-out infinite}@keyframes p{50%{opacity:.3}}
.scan{animation:s 3.2s linear infinite}@keyframes s{from{transform:translateY(-40px)}to{transform:translateY(306px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#140c28" stroke-width="1"/></pattern>
<linearGradient id="beam" x1="0" x2="1"><stop offset="0" stop-color="#5C1FD0" stop-opacity="0"/><stop offset=".5" stop-color="#a77bff"/><stop offset="1" stop-color="#5C1FD0" stop-opacity="0"/></linearGradient>
<linearGradient id="trail" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5C1FD0" stop-opacity="0"/><stop offset="1" stop-color="#5C1FD0" stop-opacity=".16"/></linearGradient>
<linearGradient id="track" x1="0" x2="1"><stop offset="0" stop-color="#5C1FD0"/><stop offset="1" stop-color="#a77bff"/></linearGradient>
<linearGradient id="track-ok" x1="0" x2="1"><stop offset="0" stop-color="#1f8f63"/><stop offset="1" stop-color="#3ef0a0"/></linearGradient>
<clipPath id="frame"><rect width="840" height="306" rx="10"/></clipPath>
</defs>
<g clip-path="url(#frame)">
<rect width="840" height="306" fill="#07040f"/>
<rect width="840" height="306" fill="url(#grid)" opacity=".7"/>
<text x="28" y="36" class="uv hd">◢ MISSION CONTROL</text><text x="812" y="36" class="dim hdr" text-anchor="end">TELEMETRY · LAST 7 DAYS</text><path d="M28 50H812" stroke="#2b1660"/><path d="M28 50H148" stroke="#5C1FD0" stroke-width="2"/><rect x="28.0" y="66" width="384.0" height="216" rx="6" fill="#0c0719" fill-opacity=".85" stroke="#2b1660"/><path d="M28.0 84V72Q28.0 66 34.0 66H68.0" fill="none" stroke="#a77bff" stroke-width="1.5"/><text x="46.0" y="96" class="w" font-size="13.5" font-weight="700" letter-spacing="1.8">SECTOR ENGINEERING</text><text x="394.0" y="96" class="ok pulse" text-anchor="end" font-size="11.5" font-weight="700" letter-spacing="1.5">● ON DUTY</text><text x="46.0" y="114" class="dim" font-size="10.5">machine 1 · transmitted 29/10</text><path d="M46.0 126H394.0" stroke="#2b1660"/><rect x="38.0" y="141" width="2" height="34" fill="#5C1FD0" opacity=".7"/><text x="46.0" y="150" class="dim" font-size="9.5" letter-spacing="1.2">AI CREW</text><text x="46.0" y="175"><tspan class="w" font-size="23" font-weight="700" data-metric="crew">6</tspan><tspan class="dim" font-size="11" dx="7">agents</tspan></text><rect x="212.0" y="141" width="2" height="34" fill="#5C1FD0" opacity=".7"/><text x="220.0" y="150" class="dim" font-size="9.5" letter-spacing="1.2">TASKS</text><text x="220.0" y="175"><tspan class="w" font-size="23" font-weight="700" data-metric="tasks">17</tspan><tspan class="dim" font-size="11" dx="7">in 7 days</tspan></text><rect x="38.0" y="188" width="2" height="34" fill="#5C1FD0" opacity=".7"/><text x="46.0" y="197" class="dim" font-size="9.5" letter-spacing="1.2">PRs FIXED</text><text x="46.0" y="222"><tspan class="w" font-size="23" font-weight="700" data-metric="prs_fixed">2</tspan><tspan class="dim" font-size="11" dx="7">by franky</tspan></text><rect x="212.0" y="188" width="2" height="34" fill="#5C1FD0" opacity=".7"/><text x="220.0" y="197" class="dim" font-size="9.5" letter-spacing="1.2">BUGS CAUGHT IN QA</text><text x="220.0" y="222"><tspan class="w" font-size="23" font-weight="700" data-metric="qa_catches">0</tspan><tspan class="dim" font-size="11" dx="7">by chopper</tspan></text><rect x="38.0" y="235" width="2" height="34" fill="#5C1FD0" opacity=".7"/><text x="46.0" y="244" class="dim" font-size="9.5" letter-spacing="1.2">BLOCKED IN PRE-REVIEW</text><text x="46.0" y="269"><tspan class="w" font-size="23" font-weight="700" data-metric="pre_review_blocks">0</tspan><tspan class="dim" font-size="11" dx="7">before push</tspan></text><rect x="212.0" y="235" width="2" height="34" fill="#5C1FD0" opacity=".7"/><text x="220.0" y="244" class="dim" font-size="9.5" letter-spacing="1.2">LAST ACTION</text><text x="220.0" y="269"><tspan class="ok" font-size="13" font-weight="700">nami · 29/10</tspan></text><rect x="428.0" y="66" width="384.0" height="216" rx="6" fill="#0c0719" fill-opacity=".85" stroke="#2b1660"/><path d="M428.0 84V72Q428.0 66 434.0 66H468.0" fill="none" stroke="#a77bff" stroke-width="1.5"/><text x="446.0" y="96" class="w" font-size="13.5" font-weight="700" letter-spacing="1.8">SECTOR DIFICILTECH</text><text x="794.0" y="96" class="dim" text-anchor="end" font-size="11" letter-spacing="1">◌ NO SIGNAL</text><path d="M446.0 124H794.0" stroke="#2b1660" stroke-dasharray="2 4"/><circle cx="620.0" cy="162.0" r="6" fill="none" stroke="#a77bff" stroke-width="1.5"><animate attributeName="r" values="6;34" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="2.4s" repeatCount="indefinite"/></circle><circle cx="620.0" cy="162.0" r="3.5" fill="#a77bff" class="pulse"/><text x="620.0" y="210.0" class="uv pulse" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="2">AWAITING FIRST CONTACT</text><text x="620.0" y="230.0" class="dim" text-anchor="middle" font-size="10.5">this sector hasn't transmitted yet</text><text x="420.0" y="297" class="dim" text-anchor="middle" font-size="9" letter-spacing="1.5" opacity=".8">hermes · AI agent crew across two ships</text>
<g class="scan"><rect y="0" width="840" height="40" fill="url(#trail)"/><rect y="39" width="840" height="1.5" fill="url(#beam)"/></g>
</g>
<rect x=".5" y=".5" width="839" height="305" rx="10" fill="none" stroke="#2b1660"/>
<path d="M7 21V7H21" fill="none" stroke="#5C1FD0" stroke-width="2"/><path d="M819 7H833V21" fill="none" stroke="#5C1FD0" stroke-width="2"/><path d="M7 285V299H21" fill="none" stroke="#5C1FD0" stroke-width="2"/><path d="M819 299H833V285" fill="none" stroke="#5C1FD0" stroke-width="2"/>
</svg>
